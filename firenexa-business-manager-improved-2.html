const KEY='firenexa_business_manager_v1'; const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0); const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={settings:{name:'FIRENEXA SAFETY SOLUTIONS',tagline:'INSPECT • MAINTAIN • PROTECT',address:'North Lakhimpur, Assam, India',phone:'',email:'',gstin:'',state:'Assam',pin:'',owner:'',bank:'',accountHolder:'',accountNumber:'',ifsc:'',upi:'',terms:'Payment due as agreed. Please contact us for any clarification.',delivery:'Delivery as mutually agreed.',qprefix:'FN/QTN',iprefix:'FN/INV',rprefix:'FN/REC',dprefix:'FN/DN',sprefix:'FN/SRV',amprefix:'FN/AMC',fy:'2026-27',logo:'',signature:'',stamp:'',taxMode:'intra',defaultGst:18},customers:[],products:[{id:'p1',code:'DEMO-ABC4',name:'4 kg ABC Fire Extinguisher',category:'ABC Dry Powder Fire Extinguishers',hsn:'',unit:'Nos',price:1800,gst:18,stock:10,active:true},{id:'p2',code:'DEMO-CO2',name:'CO2 Fire Extinguisher',category:'CO2 Fire Extinguishers',hsn:'',unit:'Nos',price:3200,gst:18,stock:5,active:true},{id:'p3',code:'DEMO-BRK',name:'Fire Extinguisher Bracket',category:'Accessories',hsn:'',unit:'Nos',price:250,gst:18,stock:20,active:true},{id:'p4',code:'DEMO-SIGN',name:'Fire Safety Signage',category:'Fire Safety Signage',hsn:'',unit:'Nos',price:150,gst:18,stock:30,active:true},{id:'p5',code:'DEMO-INSP',name:'Fire Extinguisher Inspection Service',category:'Inspection',hsn:'',unit:'Service',price:500,gst:18,stock:'',active:true},{id:'p6',code:'DEMO-TRANS',name:'Transportation',category:'Transportation',hsn:'',unit:'Trip',price:300,gst:18,stock:'',active:true}],docs:[],payments:[],seq:{},audit:[],demo:true};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){db=structuredClone(defaults)}; let pendingDocType=''; // Catalogue expansion: common extinguisher sizes and related services.
const extraCatalogue=[
['ABC-1KG','1 kg ABC Dry Powder Fire Extinguisher','ABC Dry Powder Fire Extinguishers','Nos',650,18,10],
['ABC-2KG','2 kg ABC Dry Powder Fire Extinguisher','ABC Dry Powder Fire Extinguishers','Nos',950,18,10],

['ABC-6KG','6 kg ABC Dry Powder Fire Extinguisher','ABC Dry Powder Fire Extinguishers','Nos',2400,18,10],
['ABC-9KG','9 kg ABC Dry Powder Fire Extinguisher','ABC Dry Powder Fire Extinguishers','Nos',3200,18,10],
['ABC-25KG','25 kg ABC Dry Powder Fire Extinguisher (Trolley)','ABC Dry Powder Fire Extinguishers','Nos',9500,18,10],
['CO2-2KG','2 kg CO2 Fire Extinguisher','CO2 Fire Extinguishers','Nos',2400,18,10],
['CO2-4.5KG','4.5 kg CO2 Fire Extinguisher','CO2 Fire Extinguishers','Nos',4200,18,10],
['WATER-9L','9 L Water Fire Extinguisher','Water Fire Extinguishers','Nos',1800,18,10],

['EMLIGHT','Emergency Light','Emergency Lights','Nos',850,18,10],
['REFILL-ABC','ABC Extinguisher Refilling Service','Refilling Services','Service',450,18,''],
['INSPECT','Fire Extinguisher Inspection Service','Inspection','Service',500,18,''],
['MAINT','Fire Extinguisher Maintenance Service','Maintenance','Service',650,18,''],
['AMC-SVC','Annual Maintenance Contract Service','AMC Services','Year',0,18,''],
['TRANS','Transportation','Transportation','Trip',300,18,'']
];
for(const [code,name,category,unit,price,gst,stock] of extraCatalogue){if(!db.products.some(p=>p.name.toLowerCase()===name.toLowerCase()))db.products.push({id:'cat-'+code.toLowerCase(),code,name,category,description:'Demo catalogue item — verify actual selling price and applicable GST before use.',hsn:'',unit,price,gst,stock,active:true});}
let page='Dashboard', searchTerm='';
let cloudApp=null, cloudAuth=null, cloudStore=null, cloudUser=null, cloudUnsub=null, cloudApplyingRemote=false, cloudSaveTimer=null, cloudReady=false;
const CLOUD_CONFIG_KEY='firenexa_firebase_config_v1';
const DEVICE_ID_KEY='firenexa_cloud_device_id_v1';
let cloudDeviceId=localStorage.getItem(DEVICE_ID_KEY);if(!cloudDeviceId){cloudDeviceId='device-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);localStorage.setItem(DEVICE_ID_KEY,cloudDeviceId)}
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'null')}catch(e){return null}}
function cloudStatus(message,connected=false){let el=document.getElementById('cloudStatus');if(el){el.textContent=message;el.style.background=connected?'#e2f7eb':'#fff2f3';el.style.color=connected?'#137344':'var(--red)'}let login=document.getElementById('cloudLoginBtn'),logout=document.getElementById('cloudLogoutBtn');if(login)login.classList.toggle('hidden',!!cloudUser);if(logout)logout.classList.toggle('hidden',!cloudUser);if(login&&cloudUser)login.textContent=cloudUser.email||'Signed in'}
function save(){localStorage.setItem(KEY,JSON.stringify(db));let n=document.getElementById('topname');if(n)n.textContent=db.settings.name||'FIRENEXA';if(cloudReady&&cloudUser&&!cloudApplyingRemote){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(pushCloudState,450)}}
function firebaseSettingsPanel(){let c=cloudConfig()||{};return `<div class="panel"><h2>Cloud sync across phones</h2><p class="muted">Connect Firebase once, then sign in with an approved Google account on each phone. Changes sync live through the shared cloud database.</p><div class="notice"><b>Setup required:</b> Create a Firebase project, enable Google sign-in and Firestore, configure the access rules from the included setup guide, then enter the Web App config below. This app cannot sync until those steps are complete.</div><div class="fieldgrid">${[['apiKey','Firebase API key'],['authDomain','Auth domain'],['projectId','Project ID'],['appId','App ID']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="fb_${k}" value="${esc(c[k]||'')}" placeholder="${k==='authDomain'?'your-project.firebaseapp.com':k==='projectId'?'your-project-id':'Paste from Firebase console'}"></div>`).join('')}</div><div class="toolbar" style="margin-top:14px"><button class="primary" onclick="connectFirebaseFromForm()">Save config & Connect</button><button class="secondary" onclick="cloudSignIn()">Sign in with Google</button><button class="secondary" onclick="disconnectFirebase()">Disconnect this device</button></div><p class="muted" id="cloudHelp" style="font-size:12px">${cloudUser?`Signed in as ${esc(cloudUser.email||'Google account')}.`:'Cloud status: not connected.'}</p></div>`}
function connectFirebaseFromForm(){let c={apiKey:document.getElementById('fb_apiKey')?.value.trim(),authDomain:document.getElementById('fb_authDomain')?.value.trim(),projectId:document.getElementById('fb_projectId')?.value.trim(),appId:document.getElementById('fb_appId')?.value.trim()};if(Object.values(c).some(v=>!v)){alert('Please fill in all four Firebase Web App config fields.');return}localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(c));initializeFirebase(c,true)}
function initializeFirebase(c,notify=false){if(!c||!c.apiKey||!c.projectId||!c.appId){cloudStatus('LOCAL ONLY');return}if(!window.firebase){cloudStatus('SDK NOT LOADED');if(notify)alert('Firebase SDK could not load. Check your internet connection and open the app from an HTTPS-hosted website.');return}try{if(!cloudApp){cloudApp=firebase.apps.length?firebase.app():firebase.initializeApp(c);cloudAuth=firebase.auth();cloudStore=firebase.firestore();cloudAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});cloudAuth.onAuthStateChanged(user=>{cloudUser=user||null;cloudReady=false;if(user){cloudStatus('SIGNED IN · CONNECTING');startCloudListener()}else{if(cloudUnsub){cloudUnsub();cloudUnsub=null}cloudReady=false;cloudStatus('SIGNED OUT');}})}else{cloudStatus('CONFIG LOADED')}if(notify){cloudStatus('CONFIG SAVED · SIGN IN');alert('Firebase config saved on this device. Next sign in with Google. If this app is not hosted on HTTPS yet, host it first and add that domain in Firebase Authentication settings.')}}catch(e){console.error(e);cloudStatus('CONFIG ERROR');if(notify)alert('Could not initialize Firebase: '+e.message)}}
function startCloudListener(){if(!cloudStore||!cloudUser)return;if(cloudUnsub)cloudUnsub();const ref=cloudStore.collection('businesses').doc('firenexa-main');cloudUnsub=ref.onSnapshot(async snap=>{try{if(snap.exists){let data=snap.data();if(data.updatedByDevice===cloudDeviceId){cloudReady=true;cloudStatus('LIVE SYNC',true);return}if(data.payload&&typeof data.payload==='object'){cloudApplyingRemote=true;db=data.payload;localStorage.setItem(KEY,JSON.stringify(db));render();cloudApplyingRemote=false;cloudReady=true;cloudStatus('LIVE SYNC',true);let h=document.getElementById('cloudHelp');if(h)h.textContent='Live cloud sync active. Changes on approved devices appear here automatically.'}}else{await ref.set({payload:db,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:cloudUser.uid,updatedByDevice:cloudDeviceId});cloudReady=true;cloudStatus('LIVE SYNC',true)}}catch(e){cloudApplyingRemote=false;cloudReady=false;cloudStatus('SYNC ERROR');console.error(e);let h=document.getElementById('cloudHelp');if(h)h.textContent='Sync error: '+e.message+' — check Firestore rules and internet connection.'}},e=>{cloudReady=false;cloudStatus('SYNC ERROR');console.error(e);alert('Cloud sync error. Check Firestore security rules and make sure this Google email is approved. '+e.message)})}
async function pushCloudState(){if(!cloudReady||!cloudStore||!cloudUser||cloudApplyingRemote)return;try{await cloudStore.collection('businesses').doc('firenexa-main').set({payload:db,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:cloudUser.uid,updatedByDevice:cloudDeviceId})}catch(e){cloudStatus('SYNC ERROR');console.error(e)}}
async function cloudSignIn(){if(!cloudConfig()){alert('First enter and save your Firebase Web App config in Settings → Cloud sync across phones.');go('Settings');return}if(!cloudApp)initializeFirebase(cloudConfig());if(!cloudAuth){alert('Firebase is not ready. Open this app from its HTTPS-hosted address and check the setup guide.');return}try{await cloudAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){console.error(e);if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await cloudAuth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())}catch(err){alert('Google sign-in failed: '+err.message)}}else{alert('Google sign-in failed: '+e.message+' Check that Google sign-in is enabled and this website domain is authorized in Firebase.')}}}
async function cloudSignOut(){if(cloudAuth)await cloudAuth.signOut();cloudUser=null;cloudReady=false;cloudStatus('SIGNED OUT')}
function disconnectFirebase(){if(!confirm('Disconnect cloud sync on this device? Cloud data will not be deleted; local data stays on this device.'))return;if(cloudUnsub){cloudUnsub();cloudUnsub=null}if(cloudAuth)cloudAuth.signOut().catch(()=>{});cloudUser=null;cloudReady=false;localStorage.removeItem(CLOUD_CONFIG_KEY);cloudApp=null;cloudAuth=null;cloudStore=null;cloudStatus('LOCAL ONLY');alert('This device is disconnected. Your local data remains saved.')}

const navs=[['Dashboard','⌂'],['Customers','♙'],['Products','▦'],['Quotations','▤'],['Invoices','▧'],['Receipts','▣'],['Delivery Challans','⇢'],['Service Reports','⚒'],['AMC Management','◷'],['Payments & Ledger','₹'],['Reports','▥'],['Settings','⚙']];
function navHtml(cls){return navs.map(([n,i])=>`<button class="${cls} ${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${cls==='nav'?n:''}</button>`).join('')}
function renderNav(){document.getElementById('sideNav').innerHTML=navHtml('nav');document.getElementById('bottomNav').innerHTML=navs.slice(0,5).concat([navs[9],navs[11]]).map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n==='Payments & Ledger'?'Ledger':n==='Dashboard'?'Home':n==='Customers'?'Clients':n==='Products'?'Items':n==='Settings'?'Settings':n}</button>`).join('')}
function go(p){page=p;searchTerm='';render()};function count(type){return db.docs.filter(d=>d.type===type&&!d.deleted).length}function received(){return db.payments.reduce((s,p)=>s+Number(p.amount||0),0)}function invoiced(){return db.docs.filter(d=>d.type==='Invoice'&&!d.deleted&&d.status!=='Cancelled').reduce((s,d)=>s+Number(d.total||0),0)}function outstanding(){return Math.max(0,invoiced()-receivedForInvoices())}function receivedForInvoices(){return db.payments.filter(p=>p.invoiceId).reduce((s,p)=>s+Number(p.amount||0),0)}function docType(){return ({'Quotations':'Quotation','Invoices':'Invoice','Receipts':'Receipt','Delivery Challans':'Delivery Challan','Service Reports':'Service Report','AMC Management':'AMC'})[page]}
function render(){renderNav();save();let el=document.getElementById('app'); if(page==='Dashboard')el.innerHTML=dashboard();else if(page==='Settings')el.innerHTML=settingsPage();else if(page==='Customers')el.innerHTML=customersPage();else if(page==='Products')el.innerHTML=productsPage();else if(['Quotations','Invoices','Receipts','Delivery Challans','Service Reports','AMC Management'].includes(page))el.innerHTML=docsPage();else if(page==='Payments & Ledger')el.innerHTML=paymentsPage();else if(page==='Reports')el.innerHTML=reportsPage();}
function dashboard(){let pending=db.docs.filter(d=>d.type==='Quotation'&&d.status==='Draft').length;let amc=db.docs.filter(d=>d.type==='AMC'&&d.endDate&&d.endDate>=today()&&((new Date(d.endDate)-new Date())/86400000)<45).length;return `<div class="heading"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'} 👋</h1><div class="muted">Your business at a glance</div></div><button class="primary" onclick="openDoc('Quotation')">＋ New Quotation</button></div><div class="cards">${[['Total Customers',db.customers.length,'♙'],['Quotations Created',count('Quotation'),'▤'],['Invoices Created',count('Invoice'),'▧'],['Payments Received',money(received()),'₹'],['Outstanding Payments',money(outstanding()),'◷'],['Monthly Sales',money(db.docs.filter(d=>d.type==='Invoice'&&d.date?.slice(0,7)===today().slice(0,7)).reduce((s,d)=>s+d.total,0)),'↗'],['Pending Quotations',pending,'!'],['Upcoming AMC Services',amc,'⚒']].map(x=>`<div class="card"><span class="icon">${x[2]}</span><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><h2>Quick actions</h2><div class="actions">${[['New Quotation','Create a price quote','Quotation'],['New Invoice','Bill a customer','Invoice'],['New Receipt','Record payment','Receipt'],['New Customer','Add customer','Customer'],['New Product','Add catalogue item','Product'],['New Service Report','Record inspection','Service Report']].map(a=>`<button class="action" onclick="${a[2]==='Customer'?'openCustomer()':a[2]==='Product'?'openProduct()':`openDoc('${a[2]}')`}"><b>＋ ${a[0]}</b><small>${a[1]}</small></button>`).join('')}</div><div class="panel"><h2>Recent documents</h2>${recentTable()}</div><div class="muted" style="font-size:12px">Data is saved on this browser only. Export regular backups from Settings.</div>`}
function recentTable(){let arr=[...db.docs].filter(d=>!d.deleted).sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,8);if(!arr.length)return `<div class="empty">No documents yet. Start by creating a quotation.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Document Number</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${arr.map(d=>`<tr><td><b>${esc(d.number)}</b><br>${esc(d.type)}</td><td>${esc(d.customerName||'—')}</td><td>${fmtDate(d.date)}</td><td>${money(d.total||d.amount||0)}</td><td><span class="status ${esc(d.status||'Draft').replace(' ','-')}">${esc(d.status||'Draft')}</span></td><td><button class="secondary mini" onclick="viewDoc('${d.id}')">View</button><button class="secondary mini" onclick="downloadDoc('${d.id}')">PDF</button></td></tr>`).join('')}</tbody></table></div>`}
function fmtDate(s){if(!s)return '—';let [y,m,d]=s.slice(0,10).split('-');return `${d}-${m}-${y}`}
function customersPage(){return `<div class="heading"><div><h1>Customers</h1><div class="muted">Save customer details and reuse them in documents. Add customers here first, or use “Add New Customer” inside a document form.</div></div><button class="primary" onclick="openCustomer()">＋ New Customer</button></div><div class="panel"><div class="toolbar"><input placeholder="Search name or phone…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><button class="secondary" onclick="exportCSV('customers')">Export CSV</button><label class="secondary" style="padding:10px;cursor:pointer">Import CSV<input type="file" accept=".csv,text/csv" class="hidden" onchange="importCustomers(this)"></label></div>${customerTable()}</div>`}
function customerTable(){let rows=db.customers.filter(c=>(c.name+' '+c.phone+' '+c.gstin).toLowerCase().includes(searchTerm.toLowerCase()));if(!rows.length)return `<div class="empty">No customers found. Add your first customer.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Phone / Email</th><th>Location</th><th>GSTIN</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.contact||'')}</small></td><td>${esc(c.phone||'—')}<br>${esc(c.email||'')}</td><td>${esc([c.district,c.state,c.pin].filter(Boolean).join(', ')||c.address||'—')}</td><td>${esc(c.gstin||'—')}</td><td><button class="secondary mini" onclick="customerProfile('${c.id}')">Ledger</button><button class="secondary mini" onclick="openCustomer('${c.id}')">Edit</button><button class="danger mini" onclick="deleteCustomer('${c.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function productsPage(){let rows=db.products.filter(p=>(p.name+' '+p.code+' '+p.category).toLowerCase().includes(searchTerm.toLowerCase()));return `<div class="heading"><div><h1>Products & Services</h1><div class="muted">Manage prices, tax rates and stock.</div></div><button class="primary" onclick="openProduct()">＋ New Item</button></div><div class="panel"><div class="toolbar"><input placeholder="Search products and services…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><button class="secondary" onclick="exportCSV('products')">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Code / Item</th><th>Category</th><th>Price</th><th>GST %</th><th>Stock</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b><br>${esc(p.code||'')}</td><td>${esc(p.category||'—')}</td><td>${money(p.price)}</td><td>${p.gst??0}%</td><td>${p.stock===''?'—':esc(p.stock)}</td><td><button class="secondary mini" onclick="openProduct('${p.id}')">Edit</button><button class="secondary mini" onclick="toggleProduct('${p.id}')">${p.active?'Deactivate':'Activate'}</button><button class="danger mini" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function docsPage(){let t=docType(),rows=db.docs.filter(d=>d.type===t&&!d.deleted&&(d.number+' '+d.customerName+' '+d.status).toLowerCase().includes(searchTerm.toLowerCase()));return `<div class="heading"><div><h1>${t==='AMC'?'AMC Management':t+'s'}</h1><div class="muted">Create, search, view and print your ${t.toLowerCase()} documents.</div></div><button class="primary" onclick="openDoc('${t}')">＋ New ${t}</button></div><div class="panel"><div class="toolbar"><input placeholder="Search number, customer, status…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><button class="secondary" onclick="exportCSV('docs')">Export CSV</button></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Document Number</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(d=>`<tr><td><b>${esc(d.number)}</b></td><td>${esc(d.customerName||'—')}</td><td>${fmtDate(d.date)}</td><td>${money(d.total||d.amount||0)}</td><td><span class="status ${esc(d.status||'Draft').replace(' ','-')}">${esc(d.status||'Draft')}</span></td><td><button class="secondary mini" onclick="viewDoc('${d.id}')">View</button><button class="secondary mini" onclick="editDoc('${d.id}')">Edit</button><button class="secondary mini" onclick="downloadDoc('${d.id}')">PDF</button><button class="secondary mini" onclick="duplicateDoc('${d.id}')">Copy</button><button class="danger mini" onclick="deleteDoc('${d.id}')">Delete</button>${t==='Quotation'?`<button class="primary mini" onclick="convertInvoice('${d.id}')">Invoice</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No ${t.toLowerCase()} documents yet.</div>`}</div>`}
function paymentsPage(){return `<div class="heading"><div><h1>Payments & Ledger</h1><div class="muted">Track money received and invoice balances.</div></div><button class="primary" onclick="openDoc('Receipt')">＋ Record Payment</button></div><div class="cards"><div class="card"><div class="label">Payments received</div><div class="value">${money(received())}</div></div><div class="card"><div class="label">Invoiced sales</div><div class="value">${money(invoiced())}</div></div><div class="card"><div class="label">Invoice balances</div><div class="value">${money(outstanding())}</div></div><div class="card"><div class="label">Payment records</div><div class="value">${db.payments.length}</div></div></div><div class="panel"><h2>Payment history</h2>${db.payments.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Receipt</th><th>Customer</th><th>Invoice</th><th>Method</th><th>Amount</th><th>Reference</th><th>Actions</th></tr></thead><tbody>${[...db.payments].reverse().map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.receiptNo||'—')}</td><td>${esc(p.customerName)}</td><td>${esc(p.invoiceNo||'Advance')}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${esc(p.reference||'—')}</td><td><button class="secondary mini" onclick="showReceiptForm(db.payments.find(x=>x.id==='${p.id}'))">Edit</button><button class="danger mini" onclick="deletePayment('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No payments recorded yet.</div>`}</div><div class="panel"><h2>Customer balances</h2>${customerBalances()}</div>`}
function customerBalances(){return `<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Invoiced</th><th>Paid against invoices</th><th>Balance</th></tr></thead><tbody>${db.customers.map(c=>{let inv=db.docs.filter(d=>d.type==='Invoice'&&d.customerId===c.id&&d.status!=='Cancelled').reduce((s,d)=>s+d.total,0),paid=db.payments.filter(p=>p.customerId===c.id&&p.invoiceId).reduce((s,p)=>s+p.amount,0);return `<tr><td>${esc(c.name)}</td><td>${money(inv)}</td><td>${money(paid)}</td><td><b>${money(Math.max(0,inv-paid))}</b></td></tr>`}).join('')}</tbody></table></div>`}
function reportsPage(){let inv=db.docs.filter(d=>d.type==='Invoice'&&d.status!=='Cancelled');return `<div class="heading"><div><h1>Reports</h1><div class="muted">Internal summaries only; not statutory accounting or GST returns.</div></div><button class="secondary" onclick="exportCSV('docs')">Export documents CSV</button></div><div class="cards"><div class="card"><div class="label">Total invoiced</div><div class="value">${money(inv.reduce((s,d)=>s+d.total,0))}</div></div><div class="card"><div class="label">Payments collected</div><div class="value">${money(received())}</div></div><div class="card"><div class="label">Outstanding invoices</div><div class="value">${money(outstanding())}</div></div><div class="card"><div class="label">GST in saved invoices</div><div class="value">${money(inv.reduce((s,d)=>s+(d.tax||0),0))}</div></div></div><div class="panel"><h2>Sales by date</h2>${inv.length?`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Taxable amount</th><th>Tax</th><th>Total</th></tr></thead><tbody>${inv.map(d=>`<tr><td>${esc(d.number)}</td><td>${fmtDate(d.date)}</td><td>${esc(d.customerName)}</td><td>${money(d.subtotal)}</td><td>${money(d.tax)}</td><td>${money(d.total)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Create invoices to see sales reports.</div>`}</div>`}
function settingsPage(){let s=db.settings;return `<div class="heading"><div><h1>Business Settings</h1><div class="muted">Update details used on your documents.</div></div><button class="primary" onclick="saveSettings()">Save Settings</button></div><div class="notice"><b>Setup note:</b> Local storage works by default. Cloud sync becomes active only after Firebase is configured, Google sign-in is enabled, Firestore security rules are set, and this app is hosted on HTTPS.</div>${firebaseSettingsPanel()}<div class="panel"><h2>Business information</h2><div class="fieldgrid">${field('name','Business Name',s.name)}${field('tagline','Tagline',s.tagline)}${field('owner','Owner Name',s.owner)}${field('phone','Phone',s.phone,'tel')}${field('email','Email',s.email,'email')}${field('gstin','Business GSTIN (optional)',s.gstin)}${field('address','Business Address',s.address,'text',true)}${field('state','State',s.state)}${field('pin','PIN Code',s.pin)}${field('fy','Financial Year',s.fy)}${field('qprefix','Quotation Prefix',s.qprefix)}${field('iprefix','Invoice Prefix',s.iprefix)}${field('rprefix','Receipt Prefix',s.rprefix)}${field('dprefix','Challan Prefix',s.dprefix)}${field('sprefix','Service Report Prefix',s.sprefix)}${field('amprefix','AMC Prefix',s.amprefix)}${field('defaultGst','Default GST % (confirm per item)',s.defaultGst,'number')}${field('terms','Default Payment Terms',s.terms,'text',true)}${field('delivery','Default Delivery Terms',s.delivery,'text',true)}</div></div><div class="panel"><h2>Bank details (optional)</h2><div class="fieldgrid">${field('bank','Bank Name',s.bank)}${field('accountHolder','Account Holder',s.accountHolder)}${field('accountNumber','Account Number',s.accountNumber)}${field('ifsc','IFSC',s.ifsc)}${field('upi','UPI ID',s.upi)}</div></div><div class="panel"><h2>Logo, signature & stamp</h2><div class="fieldgrid">${uploadField('logo','Business Logo',s.logo)}${uploadField('signature','Authorized Signature',s.signature)}${uploadField('stamp','Business Stamp',s.stamp)}</div></div><div class="panel"><h2>Data backup</h2><p class="muted">Export a JSON backup regularly. Keep it somewhere safe.</p><div class="toolbar"><button class="primary" onclick="backup()">Download JSON Backup</button><label class="secondary" style="padding:10px;cursor:pointer">Restore Backup<input type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)"></label><button class="secondary" onclick="exportCSV('customers')">Customers CSV</button><button class="secondary" onclick="exportCSV('products')">Products CSV</button><button class="secondary" onclick="exportCSV('docs')">Documents CSV</button></div><button class="danger" onclick="clearDemo()">Reset all application data</button></div>`}
function field(k,label,val,type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input data-setting="${k}" type="${type}" value="${esc(val??'')}"></div>`}function uploadField(k,label,val){return `<div class="field"><label>${label}</label><input type="file" accept="image/*" onchange="uploadSetting('${k}',this)">${val?`<img class="logoimg" src="${val}" alt="${label} preview">`:''}</div>`}
function saveSettings(){document.querySelectorAll('[data-setting]').forEach(i=>db.settings[i.dataset.setting]=i.value);save();render();alert('Business settings saved.')};function uploadSetting(k,input){let f=input.files[0];if(!f)return;if(f.size>1500000){alert('Please use an image smaller than 1.5 MB.');input.value='';return}let r=new FileReader();r.onload=()=>{db.settings[k]=r.result;save();render()};r.readAsDataURL(f)}
function openCustomer(id){let c=db.customers.find(x=>x.id===id)||{};showModal(id?'Edit Customer':'New Customer',`<form id="custform" onsubmit="saveCustomer(event,'${id||''}')"><div class="fieldgrid">${[['name','Customer / Company Name'],['contact','Contact Person'],['phone','Phone Number'],['email','Email'],['address','Full Address'],['district','District'],['state','State'],['pin','PIN Code'],['gstin','GSTIN (if applicable)'],['notes','Notes']].map(([k,l])=>`<div class="field ${['address','notes'].includes(k)?'full':''}"><label>${l}</label>${k==='notes'||k==='address'?`<textarea name="${k}">${esc(c[k]||'')}</textarea>`:`<input name="${k}" value="${esc(c[k]||'')}" ${k==='name'?'required':''} ${k==='phone'?'type="tel"':''} ${k==='email'?'type="email"':''}>`}</div>`).join('')}</div><div class="toolbar" style="margin-top:18px"><button class="primary">Save Customer</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`)}
function saveCustomer(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let dupe=db.customers.find(c=>c.id!==id&&((f.phone&&c.phone===f.phone)||(f.gstin&&c.gstin&&c.gstin.toLowerCase()===f.gstin.toLowerCase())));if(dupe&&!confirm(`Possible duplicate: ${dupe.name}. Save anyway?`))return;let c={...f,id:id||uid()};if(id)db.customers=db.customers.map(x=>x.id===id?c:x);else db.customers.push(c);audit('Customer saved',c.name);save();closeModal();if(pendingDocType){let t=pendingDocType;pendingDocType='';openDoc(t,null,c.id)}else{render()}}
function startCustomerForDoc(type){pendingDocType=type;closeModal();openCustomer()}
function deleteCustomer(id){let c=db.customers.find(x=>x.id===id);if(!c)return;let linked=db.docs.filter(d=>d.customerId===id&&!d.deleted).length;if(!confirm(`Delete customer "${c.name}"? ${linked?linked+' linked document(s) will keep their saved history, but the customer will no longer appear in selection lists.':''} This cannot be undone except by restoring a backup.`))return;db.customers=db.customers.filter(x=>x.id!==id);audit('Customer deleted',c.name);save();render()}
function openProduct(id){let p=db.products.find(x=>x.id===id)||{active:true,unit:'Nos',gst:db.settings.defaultGst};showModal(id?'Edit Product / Service':'New Product / Service',`<form id="prodform" onsubmit="saveProduct(event,'${id||''}')"><div class="fieldgrid">${[['code','Product / Service Code'],['name','Product / Service Name'],['category','Category'],['hsn','HSN / SAC Code (confirm yourself)'],['unit','Unit'],['price','Selling Price (₹)'],['gst','GST Rate %'],['stock','Stock Quantity (optional)'],['minStock','Minimum Stock Alert']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(p[k]??'')}" ${['price','gst','stock','minStock'].includes(k)?'type="number" min="0" step="0.01"':''} ${k==='name'?'required':''}></div>`).join('')}<div class="field"><label>Active</label><select name="active"><option value="true" ${p.active?'selected':''}>Active</option><option value="false" ${!p.active?'selected':''}>Inactive</option></select></div></div><div class="toolbar" style="margin-top:18px"><button class="primary">Save Item</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`)}
function saveProduct(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));['price','gst','stock','minStock'].forEach(k=>f[k]=f[k]===''?'':Number(f[k]));f.active=f.active==='true';let p={...f,id:id||uid()};if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);audit('Product saved',p.name);save();closeModal();render()}function toggleProduct(id){let p=db.products.find(x=>x.id===id);p.active=!p.active;save();render()}function deleteProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;if(!confirm(`Delete "${p.name}" from the catalogue? Existing documents keep their item descriptions.`))return;db.products=db.products.filter(x=>x.id!==id);audit('Product deleted',p.name);save();render()}
function openDoc(type,from=null,selectedCustomerId=null){let src=from?db.docs.find(d=>d.id===from):null;let id=src?null:null;let date=today();let prefix=({Quotation:'qprefix',Invoice:'iprefix',Receipt:'rprefix','Delivery Challan':'dprefix','Service Report':'sprefix',AMC:'amprefix'})[type];let number=src?.number||nextNo(type);date=src?.date||date;let c=src?db.customers.find(x=>x.id===src.customerId):(selectedCustomerId?db.customers.find(x=>x.id===selectedCustomerId):null);let items=src?.items?.length?src.items.map(x=>({...x})):type==='Quotation'||type==='Invoice'?[{productId:'',name:'',hsn:'',qty:1,unit:'Nos',price:0,discount:0,gst:db.settings.defaultGst}]:[];
if(type==='Receipt'){showReceiptForm(src,selectedCustomerId);return}if(!['Quotation','Invoice','Delivery Challan','Service Report','AMC'].includes(type)){alert('This document type is not available.');return}
showModal('New '+type,`${type==='Invoice'&&!db.settings.gstin?'<div class="notice">Business GSTIN is not configured. Review tax status and confirm whether a tax invoice is appropriate before issuing.</div>':''}<form id="docform" onsubmit="saveDoc(event,'${type}','${src?.id||''}')"><div class="fieldgrid"><div class="field"><label>Document Number</label><input name="number" value="${esc(number)}" required></div><div class="field"><label>${type} Date</label><input name="date" type="date" value="${date}" required></div><div class="field"><label>Customer</label><select name="customerId" onchange="fillCustomer(this)" required><option value="">${db.customers.length?'Select customer…':'No customers saved yet'}</option>${db.customers.map(x=>`<option value="${x.id}" ${src?.customerId===x.id||selectedCustomerId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button type="button" class="secondary mini" onclick="startCustomerForDoc('${type}')">＋ Add New Customer</button></div><div class="field"><label>Customer Name</label><input name="customerName" value="${esc(src?.customerName||c?.name||'')}" required></div>${type==='Quotation'?`<div class="field"><label>Valid Until</label><input name="validUntil" type="date" value="${src?.validUntil||''}"></div><div class="field"><label>Status</label><select name="status"><option ${src?.status==='Draft'?'selected':''}>Draft</option><option ${src?.status==='Sent'?'selected':''}>Sent</option><option ${src?.status==='Accepted'?'selected':''}>Accepted</option><option ${src?.status==='Rejected'?'selected':''}>Rejected</option><option ${src?.status==='Expired'?'selected':''}>Expired</option></select></div>`:type==='Invoice'?`<div class="field"><label>Due Date</label><input name="dueDate" type="date" value="${src?.dueDate||''}"></div><div class="field"><label>Invoice Type</label><select name="invoiceKind"><option ${src?.invoiceKind==='Commercial Invoice'||src?.title==='Commercial Invoice'?'selected':''}>Commercial Invoice</option><option ${src?.invoiceKind==='Pro Forma Invoice'||src?.title==='Pro Forma Invoice'?'selected':''}>Pro Forma Invoice</option><option ${db.settings.gstin?'':'disabled'} ${src?.title?.startsWith('Tax Invoice')?'selected':''}>Tax Invoice (confirm eligibility)</option></select></div><div class="field"><label>Tax treatment</label><select name="taxMode"><option value="intra" ${db.settings.taxMode==='intra'?'selected':''}>Intra-state (CGST + SGST)</option><option value="inter" ${db.settings.taxMode==='inter'?'selected':''}>Inter-state (IGST)</option><option value="none">No tax applied (confirm treatment)</option></select></div>`:''}</div>${['Quotation','Invoice'].includes(type)?`<div style="margin:22px 0"><h3>Items and services</h3><div id="itemrows">${items.map(itemRow).join('')}</div><button type="button" class="secondary" onclick="addItemRow()">＋ Add item</button></div><div class="fieldgrid"><div class="field"><label>Transportation / Delivery Charges (₹)</label><input name="transport" type="number" min="0" step="0.01" value="${src?.transport||0}" oninput="calcDocTotals()"></div><div class="field"><label>Other Charges (₹)</label><input name="other" type="number" min="0" step="0.01" value="${src?.other||0}" oninput="calcDocTotals()"></div><div class="field"><label>Overall Discount (₹)</label><input name="overallDiscount" type="number" min="0" step="0.01" value="${src?.overallDiscount||0}" oninput="calcDocTotals()"></div><div class="field"><label>Payment Terms</label><input name="terms" value="${esc(src?.terms||db.settings.terms)}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(src?.notes||'')}</textarea></div></div><div class="totalbox" id="doctotals"></div>`:type==='Delivery Challan'?`<div class="fieldgrid" style="margin-top:15px">${[['deliveryAddress','Delivery Address'],['purpose','Purpose of Delivery'],['transportDetails','Vehicle / Transport Details'],['deliveredBy','Delivered By'],['receivedBy','Received By']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(src?.[k]||'')}"></div>`).join('')}<div class="field full"><label>Items / Description / Quantity / Serial Number</label><textarea name="description" required>${esc(src?.description||'')}</textarea></div></div>`:type==='Service Report'?`<div class="fieldgrid" style="margin-top:15px">${[['siteAddress','Site Address'],['technician','Technician Name'],['equipment','Equipment Type / Brand / Serial Number'],['location','Equipment Location'],['condition','Condition'],['findings','Inspection Findings'],['performed','Service Performed'],['defects','Defects Found'],['recommendations','Recommendations'],['parts','Parts Replaced'],['nextDate','Next Recommended Inspection Date'],['representative','Customer Representative']].map(([k,l])=>`<div class="field ${['findings','performed','defects','recommendations','parts','equipment'].includes(k)?'full':''}"><label>${l}</label><textarea name="${k}">${esc(src?.[k]||'')}</textarea></div>`).join('')}</div><div class="notice">This report records the service/inspection performed by the business. It is not a government Fire NOC, statutory certification, or guarantee of regulatory compliance.</div>`:`<div class="fieldgrid" style="margin-top:15px">${[['siteAddress','Site Address'],['startDate','Contract Start Date'],['endDate','Contract End Date'],['visits','Number of Visits'],['scope','Scope of Work'],['exclusions','Exclusions'],['response','Response Time'],['amount','Contract Amount (₹)'],['taxRate','Applicable Tax %'],['paymentSchedule','Payment Schedule'],['responsibilities','Responsibilities'],['termsText','Terms and Conditions']].map(([k,l])=>`<div class="field ${['scope','exclusions','responsibilities','termsText'].includes(k)?'full':''}"><label>${l}</label><textarea name="${k}">${esc(src?.[k]||'')}</textarea></div>`).join('')}</div>`}<div class="toolbar" style="margin-top:20px"><button class="primary">Save ${type}</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);if(['Quotation','Invoice'].includes(type))calcDocTotals();}
function itemRow(it={}){return `<div class="itemrow"><div><label>Product / description</label><select class="prodsel" onchange="selectProduct(this)"><option value="">Custom item…</option>${db.products.filter(p=>p.active).map(p=>`<option value="${p.id}" ${it.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="itemname" placeholder="Item name" value="${esc(it.name||'')}" style="margin-top:5px"></div><div><label>Qty</label><input class="qty" type="number" min="0.01" step="0.01" value="${it.qty??1}" oninput="calcDocTotals()"></div><div><label>Unit price ₹</label><input class="price" type="number" min="0" step="0.01" value="${it.price??0}" oninput="calcDocTotals()"></div><div class="unitfield"><label>Discount ₹</label><input class="discount" type="number" min="0" step="0.01" value="${it.discount??0}" oninput="calcDocTotals()"></div><div class="taxfield"><label>GST %</label><input class="gst" type="number" min="0" max="100" step="0.01" value="${it.gst??db.settings.defaultGst}" oninput="calcDocTotals()"></div><button type="button" class="danger" onclick="this.parentElement.remove();calcDocTotals()">×</button><input class="hsn" type="hidden" value="${esc(it.hsn||'')}"><input class="unit" type="hidden" value="${esc(it.unit||'Nos')}"></div>`}
function addItemRow(){document.getElementById('itemrows').insertAdjacentHTML('beforeend',itemRow());calcDocTotals()}function selectProduct(sel){let p=db.products.find(x=>x.id===sel.value),r=sel.closest('.itemrow');if(p){r.querySelector('.itemname').value=p.name;r.querySelector('.price').value=p.price;r.querySelector('.gst').value=p.gst??db.settings.defaultGst;r.querySelector('.hsn').value=p.hsn||'';r.querySelector('.unit').value=p.unit||'Nos'}calcDocTotals()}function calcDocTotals(){let rows=[...document.querySelectorAll('#itemrows .itemrow')];let subtotal=0,tax=0;rows.forEach(r=>{let v=Math.max(0,(+r.querySelector('.qty').value||0)*(+r.querySelector('.price').value||0)-(+r.querySelector('.discount').value||0));subtotal+=v;tax+=v*(+r.querySelector('.gst').value||0)/100});let f=document.getElementById('docform');if(!f)return;let transport=+(f.transport?.value||0),other=+(f.other?.value||0),disc=+(f.overallDiscount?.value||0),grand=Math.max(0,subtotal+tax+transport+other-disc);let el=document.getElementById('doctotals');if(el)el.innerHTML=`<div class="totalrow"><span>Taxable subtotal</span><b>${money(subtotal)}</b></div><div class="totalrow"><span>Estimated GST</span><b>${money(tax)}</b></div><div class="totalrow"><span>Additional charges</span><b>${money(transport+other)}</b></div><div class="totalrow"><span>Overall discount</span><b>− ${money(disc)}</b></div><div class="totalrow grand"><span>Grand total</span><b>${money(grand)}</b></div><small class="muted">Tax breakdown and eligibility must be reviewed by the owner.</small>`}
function fillCustomer(sel){let c=db.customers.find(x=>x.id===sel.value);let i=document.querySelector('[name="customerName"]');if(c&&i)i.value=c.name}
function nextNo(type){let code=({Quotation:'qprefix',Invoice:'iprefix',Receipt:'rprefix','Delivery Challan':'dprefix','Service Report':'sprefix',AMC:'amprefix'})[type],prefix=db.settings[code]||'FN/DOC',key=type+'-'+db.settings.fy;let used=db.docs.filter(d=>d.type===type).length+1;let n=Math.max(used,db.seq[key]||1);db.seq[key]=n+1;save();return `${prefix}/${db.settings.fy}/${String(n).padStart(3,'0')}`}
function saveDoc(e,type,id){e.preventDefault();let f=new FormData(e.target),d=Object.fromEntries(f);if(['Quotation','Invoice'].includes(type)){d.items=[...document.querySelectorAll('#itemrows .itemrow')].map(r=>({productId:r.querySelector('.prodsel').value,name:r.querySelector('.itemname').value,qty:+r.querySelector('.qty').value||0,unit:r.querySelector('.unit').value,price:+r.querySelector('.price').value||0,discount:+r.querySelector('.discount').value||0,gst:+r.querySelector('.gst').value||0,hsn:r.querySelector('.hsn').value}));if(!d.items.length||d.items.some(x=>!x.name||x.qty<=0)){alert('Add at least one valid item with a name and quantity.');return}d.subtotal=d.items.reduce((s,x)=>s+Math.max(0,x.qty*x.price-x.discount),0);d.tax=(type==='Invoice'&&d.taxMode==='none')?0:d.items.reduce((s,x)=>s+Math.max(0,x.qty*x.price-x.discount)*x.gst/100,0);d.total=Math.max(0,d.subtotal+d.tax+(+d.transport||0)+(+d.other||0)-(+d.overallDiscount||0));if(type==='Invoice'){let kind=d.invoiceKind||'Commercial Invoice';if(kind.startsWith('Tax Invoice')&&!db.settings.gstin){alert('Business GSTIN is missing. Configure business details and confirm eligibility before issuing a tax invoice.');return}d.title=kind;d.paid=id?Number(db.docs.find(x=>x.id===id)?.paid||0):0;d.status=id?(db.docs.find(x=>x.id===id)?.status||'Unpaid'):'Unpaid';d.balance=d.total-d.paid;d.taxMode=d.taxMode||'intra'}else{d.title='Quotation';d.status=d.status||'Draft'}}else if(type==='AMC'){d.total=+d.amount||0;d.status='Active'}else{d.total=0;d.status='Saved'}let c=db.customers.find(x=>x.id===d.customerId);d.customerName=d.customerName||c?.name||'';d.customerId=d.customerId||'';d.id=id||uid();d.type=type;d.created=id?(db.docs.find(x=>x.id===id)?.created||new Date().toISOString()):new Date().toISOString();d.finalized=type==='Invoice';if(id){const old=db.docs.findIndex(x=>x.id===id);if(old>=0){if(type==='Invoice'&&db.payments.some(p=>p.invoiceId===id)&&Number(d.total)!==Number(db.docs[old].total)){alert('This invoice has payments recorded. To protect the ledger, create a correction/credit note rather than changing its total.');return;}db.docs[old]={...db.docs[old],...d};}}else db.docs.push(d);audit((id?type+' edited':type+' created'),d.number);save();closeModal();render();if(confirm(`${type} saved. Open document preview now?`))viewDoc(d.id)}
function editDoc(id){let d=db.docs.find(x=>x.id===id);if(!d)return;if(d.finalized&&d.type==='Invoice'&&!confirm('This invoice is finalized. Editing will create an audit entry and update this saved browser record. Continue?'))return;if(d.type==='Receipt'){showReceiptForm(d);return}openDoc(d.type,id);return}function deleteDoc(id){let d=db.docs.find(x=>x.id===id);if(!d)return;let linkedPayments=db.payments.filter(p=>p.invoiceId===id||p.id===id).length;if(!confirm(`Delete ${d.type} ${d.number}? ${linkedPayments?'Related payment history exists; deletion may affect balances. ':''}This removes it from normal lists but retains the record in the browser database for audit.`))return;d.deleted=true;d.deletedAt=new Date().toISOString();audit('Document deleted',d.type+' '+d.number);save();render()}function duplicateDoc(id){let d=db.docs.find(x=>x.id===id);if(!d)return;if(['Quotation','Invoice'].includes(d.type)){openDoc(d.type,id)}else{alert('Duplicate this document by creating a new document and copying its details manually.') }}
function convertInvoice(id){let q=db.docs.find(d=>d.id===id);if(!q||q.type!=='Quotation')return;let prior=db.docs.find(d=>d.type==='Invoice'&&d.sourceQuotation===id);if(prior){alert('An invoice has already been created from this quotation: '+prior.number);viewDoc(prior.id);return}if(q.status!=='Accepted'&&!confirm('This quotation is not marked Accepted. Convert to an invoice anyway?'))return;let inv={...structuredClone(q),id:uid(),type:'Invoice',number:nextNo('Invoice'),date:today(),created:new Date().toISOString(),title:'Commercial Invoice',status:'Unpaid',paid:0,balance:q.total,finalized:true,sourceQuotation:id};db.docs.push(inv);audit('Quotation converted to invoice',q.number+' → '+inv.number);save();render();alert('Invoice created: '+inv.number);viewDoc(inv.id)}
function showReceiptForm(existing,selectedCustomerId=null){let d=existing||{};showModal(existing?'Edit Receipt':'Record Payment',`<form id="recform" onsubmit="saveReceipt(event,'${d.id||''}')"><div class="fieldgrid"><div class="field"><label>Receipt Number</label><input name="number" value="${esc(d.number||nextNo('Receipt'))}" required></div><div class="field"><label>Payment Date</label><input name="date" type="date" value="${d.date||today()}" required></div><div class="field"><label>Customer</label><select name="customerId" onchange="fillReceiptCustomer(this)" required><option value="">Select customer…</option>${db.customers.map(c=>`<option value="${c.id}" ${d.customerId===c.id||selectedCustomerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button type="button" class="secondary mini" onclick="startCustomerForDoc('Receipt')">＋ Add New Customer</button></div><div class="field"><label>Customer Name</label><input name="customerName" value="${esc(d.customerName||'')}" required></div><div class="field"><label>Related Invoice</label><select name="invoiceId" onchange="receiptInvoiceChange(this)"><option value="">Advance / not allocated</option>${db.docs.filter(x=>x.type==='Invoice'&&x.status!=='Cancelled').map(x=>`<option value="${x.id}" ${d.invoiceId===x.id?'selected':''}>${esc(x.number)} — ${esc(x.customerName)} (${money(invoiceBalance(x.id))})</option>`).join('')}</select></div><div class="field"><label>Payment Amount (₹)</label><input name="amount" type="number" min="0.01" step="0.01" value="${d.amount||''}" required></div><div class="field"><label>Payment Method</label><select name="method"><option ${d.method==='Cash'?'selected':''}>Cash</option><option ${d.method==='UPI'?'selected':''}>UPI</option><option ${d.method==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${d.method==='Cheque'?'selected':''}>Cheque</option><option ${d.method==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Transaction Reference (optional)</label><input name="reference" value="${esc(d.reference||'')}"></div><div class="field"><label>Payment For</label><input name="paymentFor" value="${esc(d.paymentFor||'Invoice payment')}"></div><div class="field"><label>Received By</label><input name="receivedBy" value="${esc(d.receivedBy||db.settings.owner||'')}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(d.notes||'')}</textarea></div></div><div class="toolbar" style="margin-top:18px"><button class="primary">Save Payment & Receipt</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`)}function fillReceiptCustomer(sel){let c=db.customers.find(x=>x.id===sel.value);if(c)document.querySelector('[name="customerName"]').value=c.name}function receiptInvoiceChange(){}function invoiceBalance(id){let d=db.docs.find(x=>x.id===id);return d?Math.max(0,d.total-db.payments.filter(p=>p.invoiceId===id).reduce((s,p)=>s+p.amount,0)):0}
function saveReceipt(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.amount=+d.amount;let inv=d.invoiceId?db.docs.find(x=>x.id===d.invoiceId):null;if(inv&&d.amount>invoiceBalance(inv.id)+0.001&&!confirm('This payment is greater than the remaining invoice balance. Record as entered?'))return;let dupe=d.reference&&db.payments.find(p=>p.id!==id&&p.reference&&p.reference.toLowerCase()===d.reference.toLowerCase());if(dupe&&!confirm('This transaction reference is already recorded. Save anyway?'))return;let c=db.customers.find(x=>x.id===d.customerId);d.customerName=d.customerName||c?.name||'';d.invoiceNo=inv?.number||'';d.receiptNo=d.number;d.id=id||uid();d.type='Receipt';d.total=d.amount;d.status='Received';d.created=new Date().toISOString();if(id){db.payments=db.payments.map(p=>p.id===id?d:p);let di=db.docs.findIndex(x=>x.id===id);if(di>=0)db.docs[di]={...db.docs[di],...d};else db.docs.push(d);}else{db.payments.push(d);db.docs.push(d);}audit(id?'Payment edited':'Payment recorded',d.number+' '+money(d.amount));save();closeModal();render();if(confirm('Payment saved. Open receipt preview?'))viewDoc(d.id)}
function deletePayment(id){let p=db.payments.find(x=>x.id===id);if(!p)return;if(!confirm(`Delete payment/receipt ${p.number||p.receiptNo||''} for ${money(p.amount)}? Invoice balances will be recalculated.`))return;db.payments=db.payments.filter(x=>x.id!==id);db.docs=db.docs.filter(x=>x.id!==id);audit('Payment deleted',p.number||p.receiptNo||id);save();render()}function customerProfile(id){let c=db.customers.find(x=>x.id===id);if(!c)return;let docs=db.docs.filter(d=>d.customerId===id&&!d.deleted);let due=docs.filter(d=>d.type==='Invoice').reduce((s,d)=>s+invoiceBalance(d.id),0);showModal(c.name,`<p>${esc(c.phone||'')} · ${esc(c.email||'')}</p><p>${esc(c.address||'')} ${esc(c.district||'')} ${esc(c.state||'')}</p><h3>Outstanding: ${money(due)}</h3><h3>Documents</h3>${docs.length?docs.map(d=>`<div class="totalrow"><span>${esc(d.type)} · ${esc(d.number)}</span><span>${money(d.total)} <button class="secondary mini" onclick="closeModal();viewDoc('${d.id}')">View</button></span></div>`).join(''):'<p class="muted">No documents yet.</p>'}`)}
function viewDoc(id){let d=db.docs.find(x=>x.id===id);if(!d)return;showModal('Document Preview',documentHtml(d)+`<div class="toolbar no-print" style="margin-top:15px"><button class="primary" onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="downloadDoc('${id}')">Print / Save PDF</button></div>`)}function documentHtml(d){

 </div></div>`:d.type==='Receipt'?`<section class="receiptbox"><h3>Payment received</h3><div class="totalrow"><span>Amount received</span><b class="grand">${money(d.amount)}</b></div><div class="totalrow"><span>Payment method</span><b>${esc(d.method||'—')}</b></div><div class="totalrow"><span>Transaction reference</span><b>${esc(d.reference||'—')}</b></div><div class="totalrow"><span>Related invoice</span><b>${esc(d.invoiceNo||'Advance / unallocated')}</b></div>${d.paymentFor?`<p>${esc(d.paymentFor)}</p>`:''}</section>`:`<section class="descriptionbox">${esc(d.description||d.findings||d.scope||'')}${d.siteAddress?`<p><b>Site:</b> ${esc(d.siteAddress)}</p>`:''}${d.performed?`<p><b>Service performed:</b> ${esc(d.performed)}</p>`:''}${d.recommendations?`<p><b>Recommendations:</b> ${esc(d.recommendations)}</p>`:''}${d.startDate?`<p><b>Contract period:</b> ${fmtDate(d.startDate)} to ${fmtDate(d.endDate)}</p>`:''}</section>`}
 ${d.notes?`<section class="notesbox"><b>Notes</b><p>${esc(d.notes)}</p></section>`:''}

 ${s.bank||s.upi?`<div class="bankdetails"><b>Payment Details</b><p>${[s.bank,s.accountHolder?'Account holder: '+s.accountHolder:'',s.accountNumber?'A/C: '+s.accountNumber:'',s.ifsc?'IFSC: '+s.ifsc:'',s.upi?'UPI: '+s.upi:''].filter(Boolean).map(esc).join(' · ')}</p></div>`:''}
 <div class="signaturegrid"><div><b>Customer acknowledgement</b><div class="sigline"></div><small>Name / Signature / Date</small></div><div class="authorized">${s.signature?`<img class="signatureimg" src="${s.signature}" alt="Authorized signature">`:''}${s.stamp?`<img class="stampimg" src="${s.stamp}" alt="Business stamp">`:''}<b>For ${esc(s.name)}</b><div class="sigline"></div><small>Authorized Signature</small></div></div>
 <div class="docdisclaimer">Generated by FIRENEXA Business Manager. Please verify item details, GST treatment and legal requirements before issue.</div></footer>
 </article>`;
}

w:last-child{border-bottom:0}.totalrow span{color:#4d5561}.totalrow b{text-align:right;white-space:nowrap}.grand{color:#e31837;font-size:15px;font-weight:bold;border-top:2px solid #e31837;padding-top:9px;margin-top:4px}.balance{font-weight:700}.receiptbox,.descriptionbox,.notesbox{margin:18px 0;padding:14px;border:1px solid #e1e4e9;border-radius:5px}.receiptbox h3{margin:0 0 10px}.descriptionbox{white-space:pre-wrap;min-height:100px}.notesbox p,.terms p,.bankdetails p{margin:5px 0;white-space:pre-wrap}.docfoot{border-top:1px solid #dfe2e7;margin-top:22px;padding-top:12px;font-size:10px}.terms,.bankdetails{margin-bottom:12px}.signaturegrid{display:flex;justify-content:space-between;gap:28px;margin-top:28px;page-break-inside:avoid}.signaturegrid>div{width:46%;min-height:65px}.authorized{text-align:right}.sigline{border-top:1px solid #444;margin-top:34px;width:85%}.authorized .sigline{margin-left:auto}.signatureimg,.stampimg{max-width:100px;max-height:45px;object-fit:contain;display:inline-block;margin:0 0 5px 6px}.docdisclaimer{text-align:center;border-top:1px solid #e5e7eb;padding-top:8px;margin-top:18px;color:#737984;font-size:9px}.no-print{display:none!important}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.dochead,.lineitems th,.party,.statusbox{print-color-adjust:exact;-webkit-print-color-adjust:exact}.lineitems tr{page-break-inside:avoid}.docfoot{page-break-inside:avoid}}@media(max-width:650px){.dochead,.docmeta{flex-direction:column}.docidentity{text-align:left}.lineitems{font-size:9px}.lineitems th,.lineitems td{padding:5px 3px}.totalswrap{justify-content:stretch}.totalbox{width:100%}}

function showModal(title,body){document.getElementById('modaltitle').textContent=title;document.getElementById('modalbody').innerHTML=body;document.getElementById('modalback').style.display='block'}function closeModal(){document.getElementById('modalback').style.display='none'}function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}function audit(action,detail){db.audit.push({date:new Date().toISOString(),action,detail})}
function customerBalancesExport(){return db.customers.map(c=>({name:c.name,phone:c.phone,invoiceTotal:db.docs.filter(d=>d.type==='Invoice'&&d.customerId===c.id).reduce((s,d)=>s+d.total,0)}))}
function exportCSV(what){let arr=what==='customers'?db.customers:what==='products'?db.products:db.docs;let keys=[...new Set(arr.flatMap(o=>Object.keys(o).filter(k=>typeof o[k]!=='object')))];let csv=[keys.join(','),...arr.map(o=>keys.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');downloadBlob(csv,`firenexa-${what}-${today()}.csv`,'text/csv;charset=utf-8;')}
function downloadBlob(content,name,type){let b=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}function backup(){downloadBlob(JSON.stringify(db,null,2),`firenexa-backup-${today()}.json`,'application/json')}function restoreBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.customers||!x.docs)throw Error();if(confirm('Replace all current local data with this backup?')){db=x;save();render();alert('Backup restored.')}}catch(e){alert('This file does not look like a FIRENEXA backup.')}input.value=''};r.readAsText(f)}function clearDemo(){if(!confirm('Delete all application records and reset this app? Export a backup first if needed.'))return;db=structuredClone(defaults);save();render();alert('Application data reset. Add your own customers and products.')}
function importCustomers(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let lines=r.result.split(/\r?\n/).filter(Boolean),head=lines.shift().split(',').map(x=>x.replace(/^"|"$/g,''));let count=0;for(let line of lines){let vals=line.match(/("(?:[^"]|"")*"|[^,]*)(,|$)/g)?.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'))||[];let c={};head.forEach((h,i)=>c[h]=vals[i]||'');if(c.name){c.id=uid();db.customers.push(c);count++}}save();render();alert(`Imported ${count} customers. Please review imported records.`);input.value=''};r.readAsText(f)}
